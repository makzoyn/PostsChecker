<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Просмотры сообществ VK</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --ink: #191b2c;
      --ink-2: #565a73;
      --line: #d9dce8;
      --bar: #4a3fd0;
      --on-bar: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1d2a; --ink: #ecedf5; --ink-2: #a3a6bd; --line: #2f3244; --bar: #8f87f2; --on-bar: #12131c; }
    }
    body {
      margin: 0;
      min-width: 260px;
      padding: 16px;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 system-ui, sans-serif;
    }
    h1 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
    button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 10px 14px;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
    }
    button.primary { background: var(--bar); border-color: var(--bar); color: var(--on-bar); font-weight: 600; }
    button:focus-visible { outline: 2px solid var(--bar); outline-offset: 2px; }
    p { margin: 10px 0 0; color: var(--ink-2); font-size: 13px; }
  </style>
</head>
<body>
  <h1>Просмотры сообществ VK</h1>
  <button type="button" id="open-tab" class="primary">Открыть статистику</button>
  <button type="button" id="open-here">Открыть в этом окне</button>
  <p id="error" role="alert" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
